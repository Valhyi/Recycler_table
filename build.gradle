plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.75'
}

version = '1.0.0'
group = 'com.valhyi.recyclertable'

base {
    archivesName = 'recyclertable'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = '26.2.0.70'

    parchment {
        mappingsVersion = '2026.01.01'
        minecraftVersion = '26.2'
    }

    runs {
        client {
            client()
        }
    }

    mods {
        recyclertable {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    maven { url = 'https://maven.neoforged.net/releases' }
    mavenCentral()
}

dependencies {
}
