plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = '1.0.0'
group = 'com.valhyi.recyclertable'

base {
    archivesName = 'recyclertable'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    enable {
        version = '26.2.0.70'
        disableRecompilation = false
    }

    runs {
        client {
            client()
        }
    }

    mods {
        recyclertable {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    maven { url = 'https://maven.neoforged.net/releases' }
    mavenCentral()
}

dependencies {
    implementation "net.neoforged:neoforge:${neoForge.version}"
}
