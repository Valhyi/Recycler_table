plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.75'
}

version = '1.0.0'
group = 'com.valhyi.recyclertable'

base {
    archivesName = 'recyclertable'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = '26.2.0.70'
    // Forzamos el uso de la versión actual para evitar conflictos con herramientas internas nulas
    neoFormVersion = '26.2.0.70'

    runs {
        client {
            client()
        }
    }

    mods {
        recyclertable {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    maven { url = 'https://maven.neoforged.net/releases' }
    mavenCentral()
}

dependencies {
}
