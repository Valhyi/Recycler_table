name: Build Mod Jar

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Generate Gradle Wrapper Safely
      run: |
        mkdir temp_wrapper
        cd temp_wrapper
        gradle wrapper
        mv gradlew ../
        mv gradlew.bat ../
        mv gradle ../
        cd ..
        rm -rf temp_wrapper

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Build with Gradle Wrapper
      run: ./gradlew build

    - name: Upload Mod Jar
      uses: actions/upload-artifact@v4
      with:
        name: RecyclerTable-JAR
        path: build/libs/*.jar
