name: Build Mod Jar

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'

    # Configura el entorno Gradle del sistema de forma automática
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    # Ejecuta la compilación usando el comando global del sistema
    - name: Build Mod
      run: gradle build --no-daemon

    - name: Upload Mod Jar
      uses: actions/upload-artifact@v4
      with:
        name: RecyclerTable-JAR
        path: build/libs/*.jar
