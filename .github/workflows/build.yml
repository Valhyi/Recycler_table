name: Build Mod Jar

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout Code
      uses: actions/checkout@v5

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'

    # Configura el entorno Gradle del sistema de forma automática
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Regenerate Gradle Wrapper
      run: gradle wrapper

    - name: Build Mod
      run: ./gradlew build --refresh-dependencies --no-daemon
  
    - name: Upload Mod Jar
      uses: actions/upload-artifact@v4
      with:
        name: RecyclerTable-JAR
        path: build/libs/*.jar
